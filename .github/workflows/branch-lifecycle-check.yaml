# Scheduled check for unmerged Foreman fix branches.
# Flags branches older than 14 days that have not been merged into main,
# addressing source-of-truth confusion from accumulated fix branches.
#
# See: https://github.com/misospace/foreman-dispatch-bridge/issues/56

name: "Branch lifecycle check"

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:  # allow manual trigger for debugging

permissions:
  contents: read
  issues: write

jobs:
  check-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch all remote branches
        run: git fetch --all --prune

      - name: Run branch lifecycle check
        id: lifecycle
        run: |
          # Collect Foreman fix branches and their last commit dates
          BRANCHES=$(git branch -r | grep 'origin/foreman/.*/issue-' || true)
          
          if [ -z "$BRANCHES" ]; then
            echo "No Foreman fix branches found."
            echo "stale_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build JSON input for the Python module
          python -c "
import json, subprocess, sys
from datetime import datetime, timezone

branches = '''$BRANCHES'''.strip().split('\n')
data = []
for b in branches:
    b = b.strip()
    if not b:
        continue
    try:
        result = subprocess.run(
            ['git', 'log', '-1', '--format=%aI', b],
            capture_output=True, text=True, timeout=10
        )
        date_str = result.stdout.strip() or None
    except Exception:
        date_str = None
    data.append({'name': b, 'date': date_str})

print(json.dumps(data))
" > /tmp/branches.json

          # Run the lifecycle check
          python -c "
import json, sys
sys.path.insert(0, '.')
from bridge.branch_lifecycle import evaluate_branches, format_report, get_stale_branches
from datetime import datetime, timezone

with open('/tmp/branches.json') as f:
    data = json.load(f)

branch_names = [d['name'] for d in data]
dates = {}
for d in data:
    if d['date']:
        dates[d['name']] = datetime.fromisoformat(d['date'])

report = evaluate_branches(branch_names, dates, now=datetime.now(timezone.utc))
print(format_report(report))

stale = get_stale_branches(report)
if stale:
    print('---')
    print(f'Stale branches detected: {len(stale)}')
    for b in stale:
        print(f'  - {b.name} (issue #{b.issue_number})')
    
    # Write count for downstream steps
    with open('stale_count.txt', 'w') as f:
        f.write(str(len(stale)))
    sys.exit(1)
else:
    print('No stale branches detected.')
    with open('stale_count.txt', 'w') as f:
        f.write('0')
"

      - name: Report stale count
        if: always()
        run: |
          COUNT=$(cat stale_count.txt 2>/dev/null || echo "0")
          echo "Stale unmerged branches: $COUNT"
