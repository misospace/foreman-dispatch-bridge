---
# Maintains a standing "release: X.Y.Z" PR listing everything unreleased.
# Merging it is the release decision — nothing here merges on your behalf.
#
# The app token matters: a tag pushed with the default GITHUB_TOKEN does not
# trigger other workflows, so release.yaml (on: push: tags) would never fire.
# A GitHub App token does trigger it, which keeps release.yaml unchanged and
# still reachable by a hand-pushed tag.
name: Release Please

on:
  push:
    branches: ["main"]

# Serialize runs. Several pushes land on main in quick succession when a batch
# of PRs merges, and without this the runs overlap: two of them both decide to
# create the same release, the second loses and the job goes red with
# `Validation Failed: {"resource":"Release","code":"already_exists"}`. That
# happened on v0.7.5 with runs at 16:38, 16:39 and 16:42 — the release and the
# image were both fine, only the third run failed, which is worse than useless
# because a red release-please is exactly the signal you want to trust when a
# release genuinely does not ship.
#
# cancel-in-progress is false on purpose: a cancelled run could stop between
# creating the tag and creating the release. Queueing instead lets the later
# run observe the finished state and no-op.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MISO_APP_ID }}
          private-key: ${{ secrets.MISO_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
