name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Required so the Trivy SARIF upload step can publish findings to the
  # repository's Security tab.
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build image
        # Build to a tarball (never the daemon) so the Trivy gate below scans
        # the exact artifact bytes this build produced. Scanning by registry
        # ref let trivy's daemon/remote resolution pick a different image than
        # the one just built: v0.6.22's gate kept reporting the PREVIOUS
        # release's packages against a provably clean build. A tarball has no
        # resolution logic to get wrong. If a critical/high CVE is found we
        # never push.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          outputs: type=docker,dest=/tmp/bridge-image.tar
          tags: |
            ghcr.io/misospace/foreman-dispatch-bridge:${{ steps.v.outputs.version }}
            ghcr.io/misospace/foreman-dispatch-bridge:latest
          labels: |
            org.opencontainers.image.source=https://github.com/misospace/foreman-dispatch-bridge
      - name: Check TEMPORARY OS-package patch layer is still needed
        # The Dockerfile carries a TEMPORARY `apt-get install --only-upgrade`
        # layer that backports OS packages the pinned base image has not yet
        # rebuilt (CVE-2026-53615 in util-linux, CVE-2026-14456 in openssl;
        # tracked in #254). Its removal conditions live only in the Dockerfile
        # comment, so every base-image bump is a chance to forget the layer and
        # let it linger as dead weight. This step queries the base image named
        # in the Dockerfile and fails the release loudly once it ships the
        # fixes, which is the reminder to delete the layer.
        run: |
          set -euo pipefail
          base=$(grep -m1 '^FROM ' Dockerfile | awk '{print $2}')
          echo "checking base image: $base"
          # package|pinned-version pairs, kept in sync with the Dockerfile layer.
          # dpkg --compare-versions handles epochs (login) and tildes (openssl)
          # correctly; a shell string comparison would not.
          for pair in \
            "util-linux|2.41.5-0+deb13u1" \
            "bsdutils|1:2.41.5-0+deb13u1" \
            "mount|2.41.5-0+deb13u1" \
            "login|1:4.16.0-2+really2.41.5-0+deb13u1" \
            "openssl|3.5.7-1~deb13u2" \
            "libssl3t64|3.5.7-1~deb13u2" \
            "openssl-provider-legacy|3.5.7-1~deb13u2"; do
            pkg=${pair%%|*}
            pinned=${pair##*|}
            base_ver=$(docker run --rm "$base" dpkg-query -W -f='${Version}\n' "$pkg")
            echo "$pkg: base $base_ver, layer pins $pinned"
            if dpkg --compare-versions "$base_ver" ge "$pinned"; then
              echo "ERROR: base image already ships $pkg $base_ver (>= $pinned)."
              echo "The TEMPORARY OS-package patch layer in the Dockerfile is a"
              echo "no-op for $pkg. Remove the layer (or this pin) per #254."
              exit 1
            fi
          done
          echo "base image still lacks the fixes; the TEMPORARY layer is still needed."
      - name: Scan image
        # One scan: both tags name the same bytes, so scanning the tarball
        # covers versioned and latest alike.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.73.0
          input: /tmp/bridge-image.tar
          # pip/_vendor ships msgpack 1.1.2 and an SBOM declaring setuptools
          # 70.3.0; trivy's TAR path reports them as installed packages (the
          # daemon path does not, which is why local scans disagreed with CI —
          # this blocked four releases). pip's vendored tree is pip upstream's
          # surface, not this image's. Verified both directions on the same
          # tar: without the skip trivy exits 1, with it 0.
          skip-dirs: usr/local/lib/python3.14/site-packages/pip/_vendor
          format: sarif
          output: trivy.sarif
          # Gate the release on CRITICAL/HIGH vulns in the OS packages and
          # language libraries bundled into the image.
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Without this the action drops the severity filter for SARIF output
          # and the exit-code gate fires on ANY severity (v0.6.22's SARIF
          # carried a MEDIUM despite the CRITICAL,HIGH filter above).
          limit-severities-for-sarif: true
          vuln-type: os,library
          # Vulns without a published fix are reported in the Security tab via
          # the SARIF upload below, but do not block the release on their own.
          ignore-unfixed: true
          hide-progress: true
      - name: Upload Trivy scan results to GitHub Security tab
        # `if: always()` so the SARIF is published even when the scan step
        # failed, letting reviewers see the offending vulns in the Security
        # tab rather than only in the workflow log.
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Push image
        # Re-tag and push now that both Trivy scans have passed. We rebuild
        # instead of `docker push`-ing the loaded image so buildx metadata
        # (labels, provenance) is reproducible on every release.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/misospace/foreman-dispatch-bridge:${{ steps.v.outputs.version }}
            ghcr.io/misospace/foreman-dispatch-bridge:latest
          labels: |
            org.opencontainers.image.source=https://github.com/misospace/foreman-dispatch-bridge
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # release-please already creates the GitHub release when it cuts the
        # tag, and `gh release create` fails when one exists. That failed on
        # every release, so this job was permanently red and told us nothing:
        # v0.7.2 failed at the Trivy scan and published no image, and looked
        # exactly like v0.7.1, which failed here after publishing fine. Create
        # only when the release is missing, i.e. for a hand-pushed tag.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists (created by release-please)"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
